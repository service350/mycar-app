<html lang="he" dir="rtl">
<head>
<title>צ'אט מחירים My Car</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width conversation column; header with the bot's name, chat, example chips, composer. */
:root {
  --bg: #e9eef0; --panel: #ffffff; --ink: #18232a; --mute: #5a6870; --line: #d6dee2;
  --me: #d8f5e3; --me-ink: #133b25; --bot: #ffffff; --accent: #00813b; --accent-ink: #ffffff; --chip: #f4f7f8;
  --font-body: 'Assistant', 'Segoe UI', Arial, sans-serif; --font-display: 'Rubik', 'Assistant', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --panel: #172025; --ink: #e8eef0; --mute: #9aa8ae; --line: #27333a;
  --me: #1d4a33; --me-ink: #e3f6ea; --bot: #1c262c; --accent: #3ccf7f; --accent-ink: #08130d; --chip: #1c262c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1518; --panel: #172025; --ink: #e8eef0; --mute: #9aa8ae; --line: #27333a;
  --me: #1d4a33; --me-ink: #e3f6ea; --bot: #1c262c; --accent: #3ccf7f; --accent-ink: #08130d; --chip: #1c262c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; }
* { box-sizing: border-box; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 10px; line-height: 1.05; text-align: center; letter-spacing: .04em; flex: none; }
header h1 { font-family: var(--font-display); font-size: 17px; margin: 0; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--mute); font-size: 12.5px; }
header .reset { margin-inline-start: auto; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; white-space: nowrap; }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 9px 12px 7px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.msg.me { align-self: flex-start; background: var(--me); color: var(--me-ink); border-start-start-radius: 4px; }
.msg.bot { align-self: flex-end; background: var(--bot); color: var(--ink); border-start-end-radius: 4px; }
.msg em { font-style: italic; color: var(--mute); }
.msg .time { display: block; text-align: end; font-size: 11px; color: var(--mute); margin-top: 2px; font-variant-numeric: tabular-nums; }
.choices { align-self: flex-end; width: 86%; display: grid; gap: 6px; }
.choices button { border: 1px solid var(--line); background: var(--bot); color: var(--accent); border-radius: 12px; padding: 9px 12px; font: 700 14px var(--font-body); cursor: pointer; text-align: center; }
.choices button:hover { border-color: var(--accent); }
.choices .row { text-align: start; display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-weight: 600; }
.choices .row small { color: var(--mute); font-weight: 400; }
.link { align-self: flex-end; font-size: 13px; color: var(--mute); }
.link a { color: var(--accent); }
.examples { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.examples button { flex: none; max-width: 78vw; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 600 13px var(--font-body); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); }
#text { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 22px; padding: 11px 16px; font: 16px var(--font-body); }
#send { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 0 18px; font: 700 15px var(--font-body); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { text-align: center; color: var(--mute); font-size: 12px; padding: 4px 16px 0; }
</style>
</head>

<div class="app" dir="rtl">
  <header>
    <div class="avatar" aria-hidden="true">MY<br>CAR</div>
    <div>
      <h1>חישוב מחיר בצ'אט</h1>
      <p>כתבו מה אתם צריכים, ואחשב את המחיר המשתלם ביותר</p>
    </div>
    <button type="button" class="reset" id="reset">שיחה חדשה</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <p class="note">הערכה בלבד, לפי המחירון באפליקציה</p>
  <div class="examples" id="examples" aria-label="דוגמאות לשאלות"></div>
  <form id="form">
    <label for="text" class="sr" hidden>הודעה</label>
    <input id="text" autocomplete="off" placeholder="כתבו שאלה, למשל: רכב קטן ל-3 שעות מחר ב-10">
    <button id="send" type="submit">שליחה</button>
  </form>
</div>

<script>
(function () {
  MyCarBot.setConfig(window.BOT_CONFIG);
  var state = null;
  fetch('../app/config.js?t=' + Date.now()).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) { var i = t.indexOf('{'), j = t.lastIndexOf('}'); if (i >= 0) { var c = JSON.parse(t.slice(i, j + 1)); if (c && c.pricing) MyCarBot.setConfig(c); } }).catch(function () {});
  var log = document.getElementById('log');
  var EXAMPLES = ['כמה יעלה לי רכב קטן לשעה בשעה 12 בצהריים', 'רכב חשמלי מחר מ-8 בבוקר עד 5 אחה"צ, 120 ק"מ', 'רכב קטן ביום שישי ב-17:00 ל-27 שעות, 40 ק"מ', 'ואם 5 שעות?', 'נהג צעיר', 'חבילות', 'small car for 3 hours tomorrow at 10, 60 km'];
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  /* WhatsApp text marks: *bold* and _italic_ */
  function fmt(s) { return esc(s).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>').replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>'); }
  function now() { var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function bubble(who, html) { var el = document.createElement('div'); el.className = 'msg ' + who; el.innerHTML = html + '<span class="time">' + now() + '</span>'; log.appendChild(el); }
  function scroll() { log.scrollTop = log.scrollHeight; }
  function render(replies) {
    replies.forEach(function (r) {
      bubble('bot', fmt(r.text || ''));
      if (r.url) { var l = document.createElement('div'); l.className = 'link'; l.innerHTML = esc(r.url.title) + ': <a href="' + esc(r.url.href) + '" target="_blank" rel="noopener">' + esc(r.url.href) + '</a>'; log.appendChild(l); }
      var items = r.buttons ? r.buttons.map(function (b) { return { id: b.id, title: b.title }; }) : r.list ? r.list.rows : null;
      if (items) {
        var box = document.createElement('div'); box.className = 'choices';
        items.forEach(function (b) {
          var btn = document.createElement('button'); btn.type = 'button';
          if (r.list) { btn.className = 'row'; btn.innerHTML = '<span>' + esc(b.title) + '</span><small>' + esc(b.description || '') + '</small>'; }
          else btn.textContent = b.title;
          btn.addEventListener('click', function () { bubble('me', esc(b.title)); run({ id: b.id }); });
          box.appendChild(btn);
        });
        log.appendChild(box);
      }
    });
    scroll();
  }
  function run(msg) {
    var out = MyCarBot.handle(state, msg);
    state = out.state;
    setTimeout(function () { render(out.replies); }, 250);
  }
  function sendText(t) { t = String(t || '').trim(); if (!t) return; bubble('me', esc(t)); scroll(); run({ text: t }); }
  document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('text'); sendText(i.value); i.value = ''; });
  document.getElementById('reset').addEventListener('click', function () { state = null; log.innerHTML = ''; run({ text: 'היי' }); });
  var ex = document.getElementById('examples');
  EXAMPLES.forEach(function (t) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.title = t; b.addEventListener('click', function () { sendText(t); }); ex.appendChild(b); });
  /* Opens with the greeting. */
  run({ text: 'היי' });
})();
</script>
