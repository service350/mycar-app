<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מיי קאר – השכרת רכב שיתופי לפי שעה או ליום. מאות רכבים בתחנות קרובות בבני ברק, אלעד, מודיעין עילית, בית שמש, ביתר עילית וירושלים. בלי דמי מנוי, הדלק עלינו.">
<meta property="og:title" content="מיי קאר – הרכב השיתופי שלי">
<meta property="og:description" content="מיי קאר – השכרת רכב שיתופי לפי שעה או ליום. מאות רכבים בתחנות קרובות בבני ברק, אלעד, מודיעין עילית, בית שמש, ביתר עילית וירושלים. בלי דמי מנוי, הדלק עלינו.">
<meta property="og:image" content="cars/car11.webp">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a7a43">
<link rel="icon" type="image/png" href="brand/logo-wordmark.png">
<script>window.MYCAR_STATIC=true;</script>
<title>מיי קאר</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: bento hero of colored tiles → steps → fleet price list → packages → bento perks → cities → plate-yellow call band. RTL. */
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#101a3d; --muted:#5b6382; --line:#e3e7f2;
  --green:#22d47b;
  --sky:#2f7dff;
  --sun:#ffcc1f;
  --coral:#ff5a6a;
  --grape:#7b5cff;
  --navy:#101a3d; --on-dark:#f3f5ff;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --r-lg:28px; --r-md:20px;
  --shadow:0 1px 0 #101a3d08,0 12px 32px -12px #101a3d26;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f24; --card:#141b38; --ink:#eef1ff; --muted:#a3abcb; --line:#252e55;
  --shadow:0 1px 0 #00000040,0 12px 32px -12px #00000080; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f24; --card:#141b38; --ink:#eef1ff; --muted:#a3abcb; --line:#252e55;
  --shadow:0 1px 0 #00000040,0 12px 32px -12px #00000080; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;direction:rtl;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
h2{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800;letter-spacing:-.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--muted);margin:0 0 12px}
.kicker i{width:10px;height:10px;border-radius:3px;background:var(--k,var(--green));transform:rotate(45deg)}
.sub{color:var(--muted);font-size:1.12rem;max-width:58ch;margin:14px 0 0}
section{padding-block:clamp(56px,8vw,96px)}

/* pressables */
.btn,.chip,.seg button,.navlink,.copy,.pill{transition:transform 160ms var(--ease-out),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
.btn:active,.chip:active,.seg button:active,.copy:active,.pill:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:16px;font:700 1.02rem var(--display);text-decoration:none;border:0;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.dark{background:var(--navy);color:#fff}
.btn.light{background:#ffffffd9;color:var(--navy)}
@media (hover:hover) and (pointer:fine){
  .btn.dark:hover{box-shadow:0 10px 24px -8px #101a3d80}
  .btn.light:hover{background:#fff}
}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding-block:12px}
.navbar{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 1.15rem var(--display)}
.brand img{width:40px;height:40px;border-radius:50%}
.navlinks{display:flex;gap:2px;margin-inline-start:auto;list-style:none;padding:0;margin-block:0}
.navlink{display:block;padding:8px 14px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.navlink:hover{background:var(--bg);color:var(--ink)}}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:#2b1f00;text-decoration:none;font:800 1rem var(--display);padding:10px 16px;border-radius:14px;direction:ltr}
@media (max-width:900px){.navlinks{display:none}.pill{margin-inline-start:auto}}

/* hero bento */
.hero{padding-block:8px 40px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(120px,auto);gap:14px}
.tile{border-radius:var(--r-lg);padding:26px;position:relative;overflow:hidden;min-width:0}
.t-main{grid-column:span 7;grid-row:span 3;background:linear-gradient(150deg,#1fd17a 0%,#12b6a0 55%,#1d8cff 120%);color:#05261a;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:clamp(26px,4vw,44px)}
.t-main h1{font-size:clamp(2.6rem,6.4vw,5.2rem);font-weight:900;letter-spacing:-.02em;color:#04221a}
.t-main h1 span{display:block;color:#fff}
.t-main p{font-size:1.15rem;max-width:40ch;margin:16px 0 0;color:#063629;font-weight:600}
.t-main .ctas{display:flex;flex-wrap:wrap;gap:10px}
.t-main::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-140px;bottom:-200px;background:radial-gradient(circle,#ffffff55,transparent 65%);pointer-events:none}
.t-car{grid-column:span 5;grid-row:span 2;background:var(--sky);color:#fff;display:flex;flex-direction:column;padding:22px}
.t-car .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .95rem var(--display)}
.t-car .count{background:#ffffff26;padding:4px 10px;border-radius:999px;font-size:.8rem}
.hstage{position:relative;flex:1;min-height:190px;margin-top:6px}
.hstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateX(-24px) scale(.96);filter:blur(4px) drop-shadow(0 18px 18px #0a1f6060);transition:opacity 420ms var(--ease-out),transform 520ms var(--ease-out),filter 420ms var(--ease-out)}
.hstage img.on{opacity:1;transform:none;filter:blur(0) drop-shadow(0 18px 18px #0a1f6060)}
.hstage img.out{opacity:0;transform:translateX(24px) scale(.96);filter:blur(4px)}
.t-car .cname{font:800 1.3rem var(--display);min-height:1.6em;transition:opacity 200ms ease,filter 200ms ease}
.t-car .cname.swap{opacity:0;filter:blur(3px)}
.t-car::before{content:"";position:absolute;inset:auto -60px -90px auto;width:280px;height:280px;border-radius:50%;background:#ffffff1f}
.t-plate{grid-column:span 3;background:var(--sun);color:#1d1600;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.plate{display:flex;align-items:stretch;border:3px solid #1d1600;border-radius:12px;overflow:hidden;direction:ltr;width:max-content;max-width:100%}
.plate .il{background:#1546c7;color:#fff;font:700 .7rem var(--display);display:grid;place-items:center;padding:0 7px;line-height:1.1;text-align:center}
.plate .n{font:900 clamp(1.9rem,3.6vw,2.6rem) var(--display);padding:2px 12px;letter-spacing:.04em}
.t-plate small{font-weight:700}
.t-from{grid-column:span 2;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
.t-from .big{font:900 2.4rem var(--display);line-height:1;color:var(--green-d)}
.t-from .big small{font-size:1rem}
.t-from p{margin:0;color:var(--muted);font-weight:600;font-size:.95rem}
.t-strip{grid-column:span 12;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0;background:none;overflow:visible}
.mini{border-radius:var(--r-md);padding:18px 20px;display:flex;align-items:center;gap:14px;font:700 1.05rem var(--display)}
.mini svg{flex:none;width:34px;height:34px}
.mini small{display:block;font:400 .9rem var(--body);opacity:.8}
.m1{background:var(--grape-t);color:var(--grape-d)} .m2{background:var(--coral-t);color:var(--coral-d)}
.m3{background:var(--green-t);color:var(--green-d)} .m4{background:var(--sky-t);color:var(--sky-d)}
@media (max-width:1000px){
  .t-main{grid-column:span 12;grid-row:auto}
  .t-car{grid-column:span 7;grid-row:span 2}
  .t-plate{grid-column:span 5}
  .t-from{grid-column:span 5}
  .t-strip{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .t-car,.t-plate,.t-from{grid-column:span 12}
  .t-strip{grid-template-columns:1fr}
}
/* load stagger */
@media (prefers-reduced-motion:no-preference){
  .bento>.tile,.t-strip>.mini{animation:rise 520ms var(--ease-out) both}
  .bento>.tile:nth-child(2){animation-delay:60ms}.bento>.tile:nth-child(3){animation-delay:120ms}
  .bento>.tile:nth-child(4){animation-delay:170ms}
  .t-strip>.mini:nth-child(1){animation-delay:220ms}.t-strip>.mini:nth-child(2){animation-delay:260ms}
  .t-strip>.mini:nth-child(3){animation-delay:300ms}.t-strip>.mini:nth-child(4){animation-delay:340ms}
}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.985)}}

/* steps */
.steps{list-style:none;padding:0;margin:40px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--card);border-radius:var(--r-md);padding:24px;box-shadow:var(--shadow);display:grid;gap:10px;align-content:start}
.step .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff}
.step .ico svg{width:26px;height:26px}
.step .n{font:800 .8rem var(--display);color:var(--muted)}
.step h3{font-size:1.4rem;font-weight:800}
.step p{margin:0;color:var(--muted)}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* fleet */
.fleet-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.seg button{position:relative;z-index:1;border:0;background:none;font:700 .98rem var(--display);color:var(--muted);padding:10px 18px;border-radius:12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:#fff}
.seg .thumb{position:absolute;top:5px;bottom:5px;right:5px;border-radius:12px;background:var(--navy);transition:transform 260ms var(--ease-out),width 260ms var(--ease-out)}
:root[data-theme="dark"] .seg .thumb{background:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg .thumb{background:var(--sky)}}
.note{color:var(--muted);font-size:.95rem;margin:14px 0 0;transition:opacity 200ms ease}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px;margin-top:28px}
.car{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:transform 260ms var(--ease-out),box-shadow 260ms ease}
@media (hover:hover) and (pointer:fine){.car:hover{transform:translateY(-4px);box-shadow:0 1px 0 #101a3d08,0 22px 40px -16px #101a3d40}}
.stage{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--tt);margin:10px 10px 0;border-radius:calc(var(--r-lg) - 8px)}
.stage::after{content:"";position:absolute;inset:auto 18% 12% 18%;height:14px;border-radius:50%;background:#101a3d22;filter:blur(8px)}
.stage img{position:absolute;inset:8% 6%;width:88%;height:84%;object-fit:contain;z-index:1;opacity:0;transform:scale(.97);filter:blur(3px);transition:opacity 260ms var(--ease-out),transform 320ms var(--ease-out),filter 260ms var(--ease-out)}
.stage img.on{opacity:1;transform:none;filter:none}
.t-green{--tt:var(--green-t);--td:var(--green-d)} .t-sky{--tt:var(--sky-t);--td:var(--sky-d)}
.t-sun{--tt:var(--sun-t);--td:var(--sun-d)} .t-coral{--tt:var(--coral-t);--td:var(--coral-d)} .t-grape{--tt:var(--grape-t);--td:var(--grape-d)}
.cbody{padding:18px 22px 22px;display:grid;gap:14px}
.ctitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.ctitle h3{font-size:1.5rem;font-weight:800}
.badge{font:700 .75rem var(--display);color:var(--td);background:var(--tt);padding:4px 10px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .86rem var(--body);padding:5px 11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chip.on{background:var(--td);border-color:var(--td);color:var(--card)}
.chip.solo{cursor:default;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.chip:not(.on):not(.solo):hover{border-color:var(--td);color:var(--ink)}}
.pers{display:grid}
.per{grid-area:1/1;transition:opacity 200ms ease,transform 240ms var(--ease-out),filter 200ms ease}
.per[aria-hidden="true"]{opacity:0;transform:translateY(6px);filter:blur(3px);pointer-events:none;visibility:hidden}
.price{display:flex;align-items:baseline;gap:6px;margin:0;color:var(--td)}
.price .num{font-size:3rem;font-weight:900;line-height:1}
.price .cur{font:800 1.5rem var(--display)}
.price .unit{color:var(--muted);font-weight:600;margin-inline-start:4px}
.tiers{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.tiers li{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline;padding:8px 12px;background:var(--bg);border-radius:10px}
.tiers b{font-family:var(--display);font-variant-numeric:tabular-nums}
.tiers em{grid-column:1/-1;font-style:normal;font-size:.8rem;color:var(--muted)}
.flat{margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px}
.flat b{font-family:var(--display)}
.extras{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;color:var(--muted);font-size:.93rem}
.extras .hh{color:var(--td);font-weight:700}
.goodtoknow{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:var(--sun-t);color:var(--ink);border-radius:var(--r-md);padding:20px 22px}
.goodtoknow svg{width:30px;height:30px;color:var(--sun-d)}
.goodtoknow p{margin:0}
.goodtoknow p+p{margin-top:6px}

/* packages */
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;margin-top:36px}
.pkg{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.phead{padding:24px;color:#fff;position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-50px;top:-70px;background:#ffffff22}
.pkg.t-grape .phead{background:linear-gradient(140deg,#7b5cff,#b05cff)}
.pkg.t-coral .phead{background:linear-gradient(140deg,#ff8a3c,#ff5a6a)}
.pkg.t-sky .phead{background:linear-gradient(140deg,#2f7dff,#16c7d9)}
.pdur{margin:0;font-weight:700;opacity:.9}.pdur .num{font-size:2.4rem;font-weight:900;margin-inline-end:4px}
.phead h3{font-size:1.7rem;font-weight:800;margin-top:4px}
.pwin{margin:6px 0 0;opacity:.9;font-size:.95rem}
.ptable{overflow-x:auto;padding:12px 18px 0}
.ptable table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{padding:10px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.ptable thead th{font:600 .82rem var(--body);color:var(--muted)}
.ptable td{font:800 1.08rem var(--display)}
.ptable tbody th{font-weight:600}
.pnotes{list-style:none;margin:0;padding:14px 24px 22px;display:grid;gap:4px;color:var(--muted);font-size:.93rem}
.charges{margin-top:16px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow)}
.charges summary{list-style:none;cursor:pointer;padding:18px 22px;font:700 1.08rem var(--display);display:flex;justify-content:space-between;align-items:center}
.charges summary::-webkit-details-marker{display:none}
.charges summary svg{width:20px;height:20px;transition:transform 200ms var(--ease-out)}
.charges[open] summary svg{transform:rotate(180deg)}
.charges ul{list-style:none;margin:0;padding:0 22px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));column-gap:28px}
.charges li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.charges li b{font-family:var(--display);white-space:nowrap}

/* perks bento */
.perks{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:36px}
.perk{border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.perk svg{width:40px;height:40px}
.perk h3{font-size:1.5rem;font-weight:800}
.perk p{margin:0;opacity:.85}
.p1{grid-column:span 3;background:var(--green);color:#04251a}
.p2{grid-column:span 3;background:var(--navy);color:#fff}
.p3{grid-column:span 2;background:var(--sun-t);color:var(--ink)} .p3 svg{color:var(--sun-d)}
.p4{grid-column:span 2;background:var(--sky-t);color:var(--ink)} .p4 svg{color:var(--sky-d)}
.p5{grid-column:span 2;background:var(--coral-t);color:var(--ink)} .p5 svg{color:var(--coral-d)}
.p2 .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.p2 .tags span{background:#ffffff1a;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
@media (max-width:820px){.p1,.p2{grid-column:span 6}.p3,.p4,.p5{grid-column:span 3}.p5{grid-column:span 6}}
@media (max-width:520px){.perks>*{grid-column:span 6!important}}

/* cities */
.cities{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:32px 0 0}
.cities li{display:flex;align-items:center;gap:8px;font:700 1.15rem var(--display);padding:12px 18px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.cities li i{width:10px;height:10px;border-radius:50%;background:var(--d)}
.cities li.soon{background:none;box-shadow:none;border:2px dashed var(--line);color:var(--muted)}
.cities li.soon small{font:600 .8rem var(--body);background:var(--sun-t);color:var(--sun-d);padding:2px 8px;border-radius:999px}

/* call band */
.call{padding-block:0 clamp(56px,8vw,96px)}
.callbox{background:var(--sun);color:#1d1600;border-radius:36px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;position:relative;overflow:hidden}
.callbox::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-220px;background:#ffffff55}
.callbox h2{position:relative}
.callbox p{position:relative;margin:12px 0 0;font-weight:600;max-width:44ch}
.callbox .apps{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative}
.bigplate{justify-self:start;position:relative;display:grid;gap:12px;justify-items:start}
.bigplate .plate{border-width:4px;border-radius:16px;background:var(--sun);box-shadow:0 18px 30px -16px #00000060}
.bigplate .plate .n{font-size:clamp(3rem,8vw,5rem);padding:4px 20px}
.bigplate .plate .il{font-size:.85rem;padding:0 10px}

:root{
  --glass:color-mix(in srgb,var(--card) 68%,transparent);
  --glass-strong:color-mix(in srgb,var(--card) 84%,transparent);

    radial-gradient(38vmax 30vmax at 12% 18%,color-mix(in srgb,var(--grape) 30%,transparent),transparent 70%),

/* moving fleet strip */

function calcCost(c,per,qty,km,waiver,young,startHour){
  var r=c[per]||{},time=0,happy=0,kmc=0,raw=0,capped=false,tier='';
  if(per==='hourly'&&c.happyHourRate&&startHour!=null){for(var j=0;j<qty;j++){var h=(startHour+j)%24;if((h>=9&&h<12)||(h>=1&&h<7))happy++;}}
  time=(qty-happy)*(Number(r.time)||0)+happy*(Number(c.happyHourRate)||0);
  if(per==='hourly'){var t=r.tiers||[],k=t.length-1;for(var i=0;i<t.length-1;i++)if(km<=t[i].max){k=i;break;}
    var T=t[k]||{rate:0},lo=k===0?0:(Number(t[k-1].max)+1);raw=km*T.rate;tier=(k===t.length-1?lo+'+':lo+'–'+T.max)+' ק״מ · '+fmt(T.rate)+' ₪ לק״מ';
    if(T.cap!=null&&T.cap!==''&&raw>T.cap){kmc=Number(T.cap);capped=true;}else kmc=raw;}
  else{kmc=km*(Number(r.km)||0);raw=kmc;tier=fmt(r.km)+' ₪ לק״מ';}
  var w=waiver&&c.waiver&&c.waiver[per]?qty*c.waiver[per]:0;
  var y=young&&S.pricing.youth?qty*(Number(S.pricing.youth[per])||0):0;
  return {total:time+kmc+w+y,time:time,happy:happy,km:kmc,raw:raw,capped:capped,tier:tier,waiver:w,young:y};
}
function bestPackage(catId,per,qty,km,young,startHour){
  if(per!=='hourly')return null;var best=null;
  (S.pricing.packages||[]).forEach(function(p){
    if((p.categories||[]).indexOf(catId)<0||qty>Number(p.hours))return;
    if(startHour!=null&&p.startFrom&&p.startTo){var a=parseInt(p.startFrom,10),b=parseInt(p.startTo,10);if(startHour<a||startHour>b)return;}
    (p.tracks||[]).forEach(function(t){if(km>Number(t.km))return;var price=(t.byCategory&&t.byCategory[catId]!=null)?Number(t.byCategory[catId]):Number(t.price);
      if(young){if(!p.young||!p.young.allowed)return;var ys=(p.young.byCategory&&p.young.byCategory[catId]!=null)?p.young.byCategory[catId]:p.young.surcharge;price+=Number(ys)||0;}
      if(!best||price<best.price)best={name:p.name,price:price,km:t.km,hours:p.hours,days:p.days};});
  });return best;
}
function wireCalc(){
  app.querySelectorAll('.calc').forEach(function(box){
    var st={driver:'regular',period:'hourly'},sel=box.querySelector('#c-cat'),qty=box.querySelector('#c-qty'),km=box.querySelector('#c-km'),start=box.querySelector('#c-start'),wv=box.querySelector('#c-waiver');
    function fillCats(){var cur=sel.value;sel.innerHTML=cats().map(function(c){var dis=st.driver==='young'&&!c.youngAllowed;return '<option value="'+esc(c.id)+'"'+(dis?' disabled':'')+'>'+esc(c.name+(c.description?' '+c.description:''))+(dis?' (לנהג ותיק בלבד)':'')+'</option>';}).join('');
      var ok=[].slice.call(sel.options).filter(function(o){return !o.disabled;});if(cur&&ok.some(function(o){return o.value===cur;}))sel.value=cur;else if(ok[0])sel.value=ok[0].value;}
    function upd(){
      var c=catById(sel.value);if(!c)return;var per=st.period,q=Math.max(1,Math.round(Number(qty.value)||1)),k=Math.max(0,Math.round(Number(km.value)||0));
      var lab={hourly:'מספר שעות',daily:'מספר ימים',weekly:'מספר שבועות',monthly:'מספר חודשים'}[per];box.querySelector('#c-qty-l').textContent=lab;
      var showStart=per==='hourly'&&!!c.happyHourRate;box.querySelector('#c-start-w').hidden=!showStart;
      var sh=showStart&&start.value?parseInt(start.value,10):null;
      var r=calcCost(c,per,q,k,wv.checked,st.driver==='young',sh);
      var tot=box.querySelector('#c-total');tot.classList.add('swap');setTimeout(function(){tot.textContent=fmt(Math.round(r.total*100)/100);tot.classList.remove('swap');},90);
      var unit={hourly:['שעה','שעות'],daily:['יום','ימים'],weekly:['שבוע','שבועות'],monthly:['חודש','חודשים']}[per];
      box.querySelector('#c-sub').textContent=c.name+' · '+(q===1?unit[0]+' אחד':q+' '+unit[1])+' · '+k+' ק״מ';
      var rows=[['זמן'+(r.happy?' ('+(r.happy===1?'שעה מוזלת אחת':r.happy+' שעות מוזלות')+')':''),r.time],['ק״מ · '+r.tier+(r.capped?' · הופעלה תקרה':''),r.km]];
      if(r.waiver)rows.push(['ביטול השתתפות עצמית',r.waiver]);if(r.young)rows.push(['תוספת נהג צעיר / חדש',r.young]);
      box.querySelector('#c-rows').innerHTML=rows.map(function(x){return '<li><span>'+esc(x[0])+'</span><b>'+fmt(Math.round(x[1]*100)/100)+' ₪</b></li>';}).join('');
      var pk=bestPackage(c.id,per,q,k,st.driver==='young',sh),pe=box.querySelector('#c-pkg');
      pe.innerHTML=pk&&pk.price<r.total?'<div class="co-pkg">'+ic('gift')+'<div><b>כדאי יותר: '+esc(pk.name)+'</b><span>'+fmt(pk.price)+' ₪ · עד '+fmt(pk.km)+' ק״מ · '+fmt(pk.hours)+' שעות'+(pk.days?' · '+esc(pk.days):'')+'. חיסכון של '+fmt(Math.round(r.total-pk.price))+' ₪</span></div></div>':'';
    }
    box.querySelectorAll('.tg').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){st[g.dataset.k]=b.dataset.v;g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});if(g.dataset.k==='driver')fillCats();upd();});});});
    box.querySelectorAll('.stp button').forEach(function(b){b.addEventListener('click',function(){var i=b.parentNode.querySelector('input'),v=(Number(i.value)||0)+Number(b.dataset.d);i.value=Math.max(Number(i.min)||0,v);upd();});});
    [sel,qty,km,start,wv].forEach(function(el){el.addEventListener('input',upd);el.addEventListener('change',upd);});
    fillCats();upd();
  });
}

var HOLY_NAMES={shabbat:'שבת',rosh_hashana:'ראש השנה',yom_kippur:'יום כיפור',sukkot:'סוכות',shmini_atzeret:'שמיני עצרת',pesach:'פסח',shavuot:'שבועות'};
var DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function holyName(k){return String(k||'').split('+').map(function(x){return HOLY_NAMES[x.trim()]||x.trim();}).join(' ו');}
function hm(d){return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Jerusalem'});}
function dayName(d){var w=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'Asia/Jerusalem'}).format(d));return 'יום '+DAYS[w<0?0:w];}
function dmy(d){return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',timeZone:'Asia/Jerusalem'});}
R.shabbat=function(s){
  var H=S.holy||{},W=(H.windows||[]).map(function(w){return {a:new Date(w[0]),b:new Date(w[1]),k:w[2]};}).filter(function(w){return !isNaN(w.a)&&!isNaN(w.b);});
  var now=new Date(),cur=null,next=null;
  W.forEach(function(w){if(now>=w.a&&now<w.b)cur=w;else if(w.a>now&&(!next||w.a<next.a))next=w;});
  var w=cur||next;if(!w)return '';
  var name=holyName(w.k),lab=H.label?' · '+esc(H.label):'';
  var main=cur?'<b>'+esc(name)+' שלום!</b> השירות יחזור לפעול '+(name==='שבת'?'במוצאי שבת':'במוצאי החג')+' ב־'+hm(w.b)
    :'<b>'+esc(name)+' הקרובה:</b> כניסה '+dayName(w.a)+' '+dmy(w.a)+' ב־'+hm(w.a)+' · יציאה '+dayName(w.b)+' '+dmy(w.b)+' ב־'+hm(w.b);
  if(!cur&&name!=='שבת')main=main.replace(esc(name)+' הקרובה',esc(name)+' הקרוב');
  return '<div class="wrap"><div class="holybar'+(cur?' now':'')+'">'+ic('candle')+'<p>'+main+'<small>'+esc(s.text||'')+lab+'</small></p></div></div>';
};

  var T=[['contrast','ניגודיות גבוהה','eye'],['gray','גווני אפור','spark'],['links','הדגשת קישורים','arrow'],['font','גופן קריא','info'],['still','עצירת אנימציות','pause'],['cursor','סמן גדול','pin'],['focus','הדגשת מיקוד','key']];
  p.innerHTML='<div class="ax-h"><b>נגישות</b><button type="button" class="ax-x" aria-label="סגירת תפריט הנגישות">'+ic('x')+'</button></div>'+
    '<div class="ax-size"><span>גודל טקסט: <b id="ax-lvl"></b></span><div><button type="button" data-sz="-1" aria-label="הקטנת טקסט">א־</button><button type="button" data-sz="1" aria-label="הגדלת טקסט">א+</button></div></div>'+
    '<div class="ax-grid">'+T.map(function(t){return '<button type="button" data-ax="'+t[0]+'" aria-pressed="false">'+ic(t[2])+'<span>'+t[1]+'</span></button>';}).join('')+'</div>'+
    '<div class="ax-f"><button type="button" class="ax-reset">'+ic('undo')+'איפוס הגדרות</button><a href="#accessibility" class="ax-st">הצהרת נגישות</a></div>';
  document.body.appendChild(b);document.body.appendChild(p);
  function open(o){p.hidden=!o;b.setAttribute('aria-expanded',String(o));if(o){requestAnimationFrame(function(){p.classList.add('on');});var f=p.querySelector('button');if(f)f.focus();}else{p.classList.remove('on');}}
  b.addEventListener('click',function(){open(p.hidden);});
  p.querySelector('.ax-x').addEventListener('click',function(){open(false);b.focus();});
  p.addEventListener('keydown',function(e){if(e.key==='Escape'){open(false);b.focus();}});
  p.querySelectorAll('[data-ax]').forEach(function(x){x.addEventListener('click',function(){var k=x.dataset.ax;a11y[k]=!a11y[k];if(k==='still'&&!a11y.still){heroPaused=false;render();}a11yApply();});});
  p.querySelectorAll('[data-sz]').forEach(function(x){x.addEventListener('click',function(){a11y.size=Math.max(0,Math.min(3,a11y.size+Number(x.dataset.sz)));a11yApply();});});
  p.querySelector('.ax-reset').addEventListener('click',function(){var was=a11y.still;for(var k in a11y)a11y[k]=k==='size'?0:false;a11yApply();if(was){heroPaused=false;render();}});
  p.querySelector('.ax-st').addEventListener('click',function(){open(false);});
  document.addEventListener('click',function(e){if(!p.hidden&&!p.contains(e.target)&&e.target!==b&&!b.contains(e.target))open(false);});
  a11yApply();
}

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||'').slice(1);
  if(h==='admin'){loadAdmin();return;}
  if(!h||h==='home'||h==='top'){if(curPage!==S.pages[0].id){curPage=S.pages[0].id;render();}if(h)window.scrollTo(0,0);return;}
  var p=pageById(h);
  if(p){if(curPage!==p.id){curPage=p.id;render();}window.scrollTo(0,0);return;}
  for(var i=0;i<S.pages.length;i++){if((S.pages[i].sections||[]).some(function(s){return s.id===h;})){if(curPage!==S.pages[i].id){curPage=S.pages[i].id;render();}var el=document.getElementById(h);if(el)el.scrollIntoView();return;}}
}
window.addEventListener('hashchange',route);


/* ---------- hooks for the separate admin module ---------- */
API.get=function(){return S;};API.set=function(x){S=x;};
API.page=function(){return curPage;};API.setPage=function(p){curPage=p;};
API.pendingURL=pendingURL;API.render=render;API.queueRender=queueRender;API.pageById=pageById;API.cats=cats;API.catById=catById;
API.esc=esc;API.ic=ic;API.fmt=fmt;API.clone=clone;API.src=src;API.reduce=reduce;API.app=app;
var adminLoaded=false;
function loadAdmin(){if(window.MYCAR_STATIC)return;
  if(adminLoaded){if(API.show)API.show();return;}adminLoaded=true;
  window.__mycarAPI=API;
  var l=document.createElement('link');l.rel='stylesheet';l.href='admin.css';document.head.appendChild(l);
  var sc=document.createElement('script');sc.src='admin.js';sc.onerror=function(){adminLoaded=false;};document.body.appendChild(sc);
}
/* ---------- boot ---------- */
fetch('site.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  S=d;
  var h=(location.hash||'').slice(1);if(pageById(h))curPage=h;
  render();a11yBuild();if(h&&!pageById(h))route();
}).catch(function(){app.innerHTML='<div class="loading">לא הצלחנו לטעון את האתר. רעננו את הדף.</div>';});
})();

</script>
